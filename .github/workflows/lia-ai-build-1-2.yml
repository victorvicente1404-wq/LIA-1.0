name: Lia AI 1.2 branch build

on:
  push:
    branches:
      - "lia-ai/1.2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lia-ai-1-2-build
  cancel-in-progress: true

jobs:
  android-build:
    name: Build Lia AI Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lia AI 1.2 branch
        uses: actions/checkout@v4
        with:
          ref: lia-ai/1.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install dependencies and refresh Bun lockfile
        run: bun install

      - name: Commit generated lockfile when changed
        run: |
          if ! git diff --quiet -- package.json bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json bun.lock
            git commit -m "build: lock Capacitor Android dependencies"
            git push origin HEAD:refs/heads/lia-ai/1.2
          fi

      - name: Build static SPA shell
        run: bun run build

      - name: Verify static SPA entry
        run: |
          test -s .output/public/index.html
          grep -qi '<html' .output/public/index.html
          grep -qi '<script' .output/public/index.html
          test -d .output/public/assets
          echo "Static Android WebView entry verified."

      - name: Generate Android project
        run: bunx cap add android

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Install Lia native Android bridge
        run: |
          set -euo pipefail
          APP_SRC="android/app/src/main/java/app/lia/lia"
          mkdir -p "$APP_SRC" android/app/src/main/res/xml
          cp native-android/lia/*.kt "$APP_SRC/"
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SYSTEM_ALERT_WINDOW",
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace("<application", f'<uses-permission android:name="{permission}"/>\n    <application', 1)
          services = [
              '<service android:name="app.lia.lia.LiaForegroundService" android:foregroundServiceType="dataSync" android:exported="false"/>',
              '<service android:name="app.lia.lia.LiaBubbleService" android:exported="false"/>',
              '<service android:name="app.lia.lia.LiaAccessibilityService" android:exported="false" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/lia_accessibility"/></service>',
              '<service android:name="app.lia.lia.LiaNotificationListener" android:exported="false" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service>',
          ]
          for service in services:
              name = re.search(r'android:name="([^"]+)"', service).group(1)
              if name not in content:
                  content = content.replace("</application>", f"        {service}\n    </application>", 1)
          manifest.write_text(content)

          xml = Path("android/app/src/main/res/xml/lia_accessibility.xml")
          xml.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/app_name" />
          """)

          candidates = list(Path("android/app/src/main/java").rglob("MainActivity.*"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one MainActivity, found: {candidates}")
          activity = candidates[0]
          source = activity.read_text()
          if "LiaNativePlugin" not in source:
              if activity.suffix == ".java":
                  source = source.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport app.lia.lia.LiaNativePlugin;")
                  source = re.sub(r"public class MainActivity extends BridgeActivity\s*\{\s*\}", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(LiaNativePlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}", source)
              else:
                  source = source.replace("import com.getcapacitor.BridgeActivity", "import com.getcapacitor.BridgeActivity\nimport app.lia.lia.LiaNativePlugin\nimport android.os.Bundle")
                  source = re.sub(r"class MainActivity : BridgeActivity\(\)\s*\{?\s*\}?", "class MainActivity : BridgeActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        registerPlugin(LiaNativePlugin::class.java)\n        super.onCreate(savedInstanceState)\n    }\n}", source)
              if "registerPlugin(LiaNativePlugin" not in source:
                  raise SystemExit(f"Could not register LiaNativePlugin in {activity}")
              activity.write_text(source)
          print("Lia native plugin, accessibility, notifications and background service installed.")
          PY

      - name: Restore permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lia-signing.jks"
          test -s "$RUNNER_TEMP/lia-signing.jks"
          echo "Permanent signing keystore restored."

      - name: Configure permanent APK signing
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lia-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name."
              exit 1
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          content = path.read_text()
          if "signingConfigs {" in content or "liaPermanent" in content:
              raise SystemExit("Unexpected existing signing configuration; refusing to overwrite it.")
          match = re.search(r"(?m)^(\s*)buildTypes\s*\{", content)
          if not match:
              raise SystemExit("Could not locate buildTypes block in generated Android Gradle file.")
          indent = match.group(1)
          signing = (
              f"{indent}signingConfigs {{\n"
              f"{indent}    liaPermanent {{\n"
              f"{indent}        storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))\n"
              f"{indent}        storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n"
              f"{indent}        keyAlias System.getenv('ANDROID_KEY_ALIAS')\n"
              f"{indent}        keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n"
              f"{indent}    }}\n"
              f"{indent}}}\n"
          )
          debug = (
              f"{indent}buildTypes {{\n"
              f"{indent}    debug {{\n"
              f"{indent}        signingConfig signingConfigs.liaPermanent\n"
              f"{indent}    }}\n"
          )
          content = content[:match.start()] + signing + debug + content[match.end():]
          path.write_text(content)
          print("Permanent signing configuration added to the debug build.")
          PY

      - name: Verify permanent signing configuration
        run: |
          grep -q "liaPermanent" android/app/build.gradle
          test -s "$RUNNER_TEMP/lia-signing.jks"
          echo "Permanent signing configuration verified."

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lia-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload Android APK and web shell
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lia-ai-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            .output/public
          if-no-files-found: error
          retention-days: 5
