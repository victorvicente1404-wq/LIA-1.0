name: Lia AI branch build

on:
  push:
    branches:
      - "lia-ai/1.1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lia-ai-1-1-build
  cancel-in-progress: true

jobs:
  web-build:
    name: Validate Lia AI static app shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lia AI branch
        uses: actions/checkout@v4
        with:
          ref: lia-ai/1.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Verify static SPA entry for Android WebView
        run: |
          test -s .output/public/index.html
          grep -qi '<html' .output/public/index.html
          grep -qi '<script' .output/public/index.html
          test -d .output/public/assets
          echo "Static Android WebView entry verified."

      - name: Upload static web shell for Android packaging
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lia-ai-android-web-shell
          path: .output/public
          if-no-files-found: error
          retention-days: 3
